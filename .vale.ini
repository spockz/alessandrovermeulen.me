StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = Blog

[formats]
md = markdown

# Ignore code spans, raw blocks, and links for spelling checks
IgnoredScopes = code, tt, img, url, a, script, style, pre, figure

# Ignore Hugo shortcodes and footnote reference blocks
BlockIgnores = (?s)({{<.+?>}}), \
(?s)({{%+?%}}), \
(?m)(^\[\^[^\]]+\]:[^\n]+)

TokenIgnores = (\[\^[^\]]+\]:[^\n]+)

[*.md]
BasedOnStyles = British
British.Spelling = NO
